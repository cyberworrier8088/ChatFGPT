<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatFGPT - Rust Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="chat">
        <button onclick="openSettings()">Settings</button>

        <h1>Rust Chatbot</h1>

        <div id="messages"></div>

        <input
            type="text"
            id="input"
            placeholder="Type a message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    <form id="modelForm">
    <label for="modelinput">Choose or enter a model:</label>
    
    <input list="modelList" id="modelinput" placeholder="Type or select model...">
    
    <datalist id="modelList">
        <option value="nvidia/nemotron-3-nano-30b-a3b:free">
        <option value="liquid/lfm-2.5-1.2b-thinking:free">
        <option value="openai/gpt-5.3-codex">
        <option value="nvidia/nemotron-3-super-120b-a12b:free">
    </datalist>

    <button type="button" onclick="model()">Submit</button>
    </form>

    <select name="mode" id="mode">
        <option value="chat">Chat</option>
        <option value="image">Image Gen</option>
    </select>

    </div>


    <div class="popup-overlay" id="popupOverlay">

    <div class="popup" id="popup">

        <span class="close" id="closePopup">&times;</span>

        <div class="popup-content">

            <p>Enter your Hack Club API Key</p>

            <p>This key is stored locally in your browser and sent to the server for each request.</p>

            <input type="password" placeholder="Your Hack Club API key" id="KeyInput">

            <button onclick="submitForm()">Save Key</button>

        </div>

    </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
