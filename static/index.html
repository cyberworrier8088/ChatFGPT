<!DOCTYPE html>
<html>
<head>
    <title>Rust Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat">
        <h1>Rust Chatbot</h1>

        <div id="messages"></div>

        <input
            type="text"
            id="input"
            placeholder="Type a message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

        <input type="password" id="apikey" placeholder="Enter Hack club api key">
        <button onclick="saveApiKey()">
            Save API Key
        </button>

        <button onclick="clearApiKey()">
            Clear API Key
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
